workspace = { members = [
    "kangaroo_macros"
] }

[package]
name = "kangaroo"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
kangaroo_macros = { path = "./kangaroo_macros" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs"] }


[dev-dependencies]
http-body-util = "0.1.4"

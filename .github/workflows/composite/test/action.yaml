name: Test

runs:
  using: composite
  steps:
    - name: Install Cargo
      shell: bash -euo pipefail {0}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Lint
      shell: bash -euo pipefail {0}
      run: |
        cargo fmt --check --all
        cargo clippy --workspace --all-targets -- --deny warnings

    - name: Test
      shell: bash -euo pipefail {0}
      run: |
        cargo test

name: Test

runs:
  using: composite
  steps:
    - name: Install Cargo
      shell: bash -euo pipefail {0}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Lint Backend
      shell: bash -euo pipefail {0}
      run: |
        cargo fmt --check
        cargo clippy -- --deny warnings

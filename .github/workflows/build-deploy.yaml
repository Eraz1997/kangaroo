name: Build and Deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    name: Test
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Run Tests
        uses: ./.github/workflows/composite/test
  
  check-version:
    runs-on: ubuntu-24.04-arm
    name: Check Version

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Check Main Crate Version
        run: |
          main_version=$(awk -F' *= *' '
            $0 ~ /^\[package\]/ { in_package=1; next }
            in_package && $1 ~ /^version$/ {
              gsub(/["'\'']/, "", $2); print $2; exit
            }
          ' Cargo.toml)

          if [[ "${{ github.ref_name }}" != "$main_version" ]]; then
            echo "Main package version does not match tag" >> /dev/stderr
            exit 1
          fi
      
      - name: Check Macro Crate Version
        run: |
          macro_version=$(awk -F' *= *' '
            $0 ~ /^\[package\]/ { in_package=1; next }
            in_package && $1 ~ /^version$/ {
              gsub(/["'\'']/, "", $2); print $2; exit
            }
          ' kangaroo_macros/Cargo.toml)

          if [[ "${{ github.ref_name }}" != "$macro_version" ]]; then
            echo "Macro package version does not match tag" >> /dev/stderr
            exit 1
          fi

  build-and-publish:
    runs-on: ubuntu-24.04-arm
    name: Build and Publish Crates
    needs:
      - test
      - check-version

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Publish Macro Crate
        run: cargo publish -p kangaroo_macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait
        run: sleep 30

      - name: Publish Main Crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
